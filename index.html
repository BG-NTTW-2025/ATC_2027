<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ATC Radar Simulator - Refined Logic</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 1440px;
            height: 900px;
            background-color: #ff9900;
            transform-origin: center center;
            flex-shrink: 0;
            overflow: hidden;
        }

        #radar-map-layer {
            position: absolute;
            left: 100px;
            top: 0px;
            width: 78%;
            height: auto;
            z-index: 1;
            pointer-events: none;
        }

        #planes-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 5;
            pointer-events: none;
        }

        #dashboard-frame {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 10;

        }

        .dynamic-plane {
            position: absolute;
            width: 32px;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .dynamic-label {
            position: absolute;
            background-color: #ffffff;         
            border: 1px solid #000000;         
            padding: 1px 4px;                  
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #000000;
            cursor: pointer; 
            white-space: nowrap;
            transform: translate(18px, -18px); 
            z-index: 100;
            pointer-events: auto;
        }

        .trail-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: blue;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }

        .strip-container {
            position: absolute;
            width: 200px;
            display: flex;
            flex-direction: column;
            z-index: 15;
        }

        #strips-sea { left: 15px; top: 220px; }
        #strips-lake { left: 1225px; top: 220px; }

        .fps-strip {
            position: relative;
            width: 100%;
            height: 30px;
            background-color: #d0e8f2;
            border: 1px solid #1a5276;
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            box-sizing: border-box;
            cursor: pointer;
            transition: margin 0.2s ease;
            pointer-events: auto;
        }

        .fps-strip * {
            pointer-events: none;
        }

        .fps-strip.stacked {
            margin-top: -16px; 
        }

        .fps-strip:hover {
            z-index: 100;
            background-color: #e8f4f8;
        }

        .strip-col-aca { width: 65px; padding-left: 4px; overflow: hidden; white-space: nowrap; }
        .strip-col-hd  { width: 50px; text-align: center; overflow: hidden; white-space: nowrap; }
        .strip-col-sp  { width: 50px; text-align: center; overflow: hidden; white-space: nowrap; }
        .strip-col-rma { width: 30px; display: flex; justify-content: center; align-items: center; }

        .rma-lamp {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid #000;
        }
        .lamp-red { background-color: #ff0000; }
        .lamp-green { background-color: #00cc00; }

        #heading-control-group {

            z-index: 15;
        }

        #btn-heading { position: absolute; left: 1201px; top: 494px; cursor: pointer; }

        #btn-two { position: absolute; left: 1181px; top: 650px; cursor: pointer; }

        #btn-four { position: absolute; left: 1281px; top: 650px; cursor: pointer; }
        #btn-five { position: absolute; left: 1331px; top: 650px; cursor: pointer; }
		
        #btn-six { position: absolute; left: 1181px; top: 700px; cursor: pointer; }
        #btn-seven { position: absolute; left: 1231px; top: 700px; cursor: pointer; }
        #btn-eight { position: absolute; left: 1281px; top: 700px; cursor: pointer; }

        #btn-altitude { position: absolute; left: 1173px; top: 763px; cursor: pointer; }
        #btn-altitude_down { position: absolute; left: 1174px; top: 800px; cursor: pointer; }
        #btn-altitude_up { position: absolute; left: 1227px; top: 800px; cursor: pointer; }
        #btn-speed { position: absolute; left: 1284px; top: 763px; cursor: pointer; }
        #btn-speed_down { position: absolute; left: 1284px; top: 800px; cursor: pointer; }
        #btn-speed_up { position: absolute; left: 1337px; top: 800px; cursor: pointer; }
				
        #comm-control-group {
            position: absolute;

            z-index: 15;
        }

        #btn-send { position: absolute; left: 10px; top: 79px; cursor: pointer; }
        #btn-clear { position: absolute; left: 10px; top: 25px; cursor: pointer; }

        #speed-control-ui {
            position: absolute;

            z-index: 25;

            font-size: 13px;

        }

        #level-control-ui {
            position: absolute;
            left: 830px;

        }

        .ui-btn {
            cursor: pointer;

            margin: 0 1px;

        }
        .ui-btn.active {
            background: #00cc00;

        }

        #comm-atc-plane {

			font-weight: bold;

        }

        #comm-plane-atc {
            position: absolute;
            left: 350px;
            top: 99px;
            width: 845px;
            height: 30px;
            font-family: Arial, sans-serif;
            font-size: 22px;
			font-weight: bold; 
            color: #000000;
            padding: 2px 6px;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            z-index: 20;
        }

        #comm-alerts {
            position: absolute;
            left: 350px;

            font-family: Arial, sans-serif;
            font-size: 22px;
			font-weight: bold; 
            color: #ffffff; 
            padding: 2px 6px;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            z-index: 20;
        }

        #plane-coords-display {
            position: absolute;
            left: 1100px;
            top: 20px;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            z-index: 20;
            pointer-events: none;
        }

        #scale-stick {
            position: absolute;
            left: 550px; 
            top: 270px; 
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        #radar-counter {
            position: absolute;
            left: 710px; 
            top: 840px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="radar-map-layer">
            <img src="graphics/Frame_NL.png" alt="Radar Kaart" style="width: 80%; height: auto; position: absolute; left: 132px; top: 226px;">
        </div>

        <div id="planes-layer">
            <div id="trail-container"></div>
        </div>

        <div id="strips-sea" class="strip-container"></div>
        <div id="strips-lake" class="strip-container"></div>
        <div id="strips-river" class="strip-container"></div>

        <img src="graphics/Front_Frame_W80-H650.png" id="dashboard-frame" alt="Dashboard Frame">

        <div id="comm-atc-plane"></div>
        <div id="comm-plane-atc"></div>
        <div id="comm-alerts">Systeem gestart. Gereed voor vluchtbegeleiding.</div>
        <div id="plane-coords-display">Plane ID: - x = -, y = -</div>

        <div id="speed-control-ui">
            Speed: 
            <span class="ui-btn speed-btn active" onclick="setGameSpeed(1)">1x</span>
            <span class="ui-btn speed-btn" onclick="setGameSpeed(20)">20x</span>
            <span class="ui-btn speed-btn" onclick="setGameSpeed(30)">30x</span>
            <span class="ui-btn speed-btn" onclick="setGameSpeed(40)">40x</span>
            <span class="ui-btn speed-btn" onclick="setGameSpeed(50)">50x</span>
        </div>

        <div id="level-control-ui">
            Level: 
            <span class="ui-btn level-btn active" onclick="setGameLevel(1)">Lvl 1</span>
            <span class="ui-btn level-btn" onclick="setGameLevel(2)">Lvl 2</span>
        </div>

        <div id="heading-control-group">
            <img src="graphics/But_Heading_Up.png" alt="Heading Knop" id="btn-heading">
            <img src="graphics/But_L_Up.png" alt="Left Knop" id="btn-left">
            <img src="graphics/But_Est_Up.png" alt="Est Knop" id="btn-est">
            <img src="graphics/But_R_Up.png" alt="Right Knop" id="btn-right">
            <img src="graphics/But_0_Up.png" alt="Null Knop" id="btn-null">
            <img src="graphics/But_1_Up.png" alt="One Knop" id="btn-one">
            <img src="graphics/But_2_Up.png" alt="Two Knop" id="btn-two">
            <img src="graphics/But_3_Up.png" alt="Three Knop" id="btn-three">
            <img src="graphics/But_4_Up.png" alt="Four Knop" id="btn-four">
            <img src="graphics/But_5_Up.png" alt="Five Knop" id="btn-five">
            <img src="graphics/But_6_Up.png" alt="Six Knop" id="btn-six">
            <img src="graphics/But_7_Up.png" alt="Seven Knop" id="btn-seven">
            <img src="graphics/But_8_Up.png" alt="Eight Knop" id="btn-eight">
            <img src="graphics/But_9_Up.png" alt="Nine Knop" id="btn-nine">
            <img src="graphics/But_Altitude_Up.png" alt="Altitude Knop" id="btn-altitude">
            <img src="graphics/But_down_Up.png" alt="Altitude Down Knop" id="btn-altitude_down">
            <img src="graphics/But_up_Up.png" alt="Altitude Up Knop" id="btn-altitude_up">
            <img src="graphics/But_Speed_Up.png" alt="Speed Knop" id="btn-speed">
            <img src="graphics/But_down_Up.png" alt="Speed Down Knop" id="btn-speed_down">
            <img src="graphics/But_up_Up.png" alt="Speed Up Knop" id="btn-speed_up">
        </div>
            
        <div id="comm-control-group">
            <img src="graphics/But_Clear_Up.png" alt="Clear Knop" id="btn-clear">
            <img src="graphics/But_Send_Up.png" alt="Send Knop" id="btn-send">
        </div>

        <img src="graphics/Schaalstok.png" alt="Scale Stick" id="scale-stick">
        <div id="radar-counter"></div>
    </div>

<script>
    const SIMULATION = {
        pixelsPerKm: 4.4,
        kmPerNM: 1.852,
        gameSpeed: 1,
        gameLevel: 1 
    };

    const RUNWAY = { x: 722, y: 535 };
    const PIXELS_PER_NM = SIMULATION.pixelsPerKm * SIMULATION.kmPerNM;

    function knotsToPixelsPerSecond(knots) {
        return knots * SIMULATION.kmPerNM / 3600 * SIMULATION.pixelsPerKm;
    }

    function setGameSpeed(speed) {
        SIMULATION.gameSpeed = speed;
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.includes(speed + 'x')) {
                btn.classList.add('active');
            }
        });
    }

    function setGameLevel(level) {
        SIMULATION.gameLevel = level;
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.includes('Lvl ' + level)) {
                btn.classList.add('active');
            }
        });
        document.getElementById('comm-alerts').innerText = `Spel gezet op Level ${level}.`;
    }

    function resizeGame() {
        const container = document.getElementById('game-container');
        const targetWidth = 1440;
        const targetHeight = 900;
        
        const scaleX = window.innerWidth / targetWidth;
        const scaleY = window.innerHeight / targetHeight;
        const scale = Math.min(scaleX, scaleY);
        container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);

    let planes = [];
    let nextPlaneIndex = 0; 
    let selectedPlane = null;

    let currentCommandType = null; 
    let commandDetails = "";       
    let bufferTargetAltitude = 0;  
    let bufferTargetSpeed = 0;     

    function getPlaneCode(index) {
        let firstChar = String.fromCharCode(65 + Math.floor(index / 26));
        let secondChar = String.fromCharCode(65 + (index % 26));
        return firstChar + secondChar;
    }

    let timeSinceLastSpawn = 0;
    let nextSpawnInterval = getRandomSpawnInterval();

    function getRandomSpawnInterval() {
        return Math.random() * 60 + 60; 
    }

    const routeTemplates = [
        {
            startX: 220, startY: 300, heading: 75, // Sea
            targetX: 800, targetY: 250,
            holdingCenterX: 415, holdingCenterY: 290, holdingRadius: 40,
            triggerType: "Y", triggerVal: 250
        },
        {
            startX: 1140, startY: 340, heading: 263, //Lake
            targetX: 950, targetY: 362,
            holdingCenterX: 945, holdingCenterY: 322, holdingRadius: 40,
            triggerType: "X", triggerVal: 949
        },
        {
            startX: 230, startY: 800, heading: 69, // River
            targetX: 800, targetY: 700,
            holdingCenterX: 403, holdingCenterY: 778, holdingRadius: 40,
            triggerType: "Y", triggerVal: 738
        }
    ];

    const AIRCRAFT_TYPES = {
        HEAVY: { img: 'graphics/plane_1.png', cruiseKnots: 220, minSpeed: 160, maxSpeed: 250 },
        MEDIUM: { img: 'graphics/plane_2.png', cruiseKnots: 210, minSpeed: 160, maxSpeed: 250 },
        LIGHT: { img: 'graphics/plane_3.png', cruiseKnots: 180, minSpeed: 120, maxSpeed: 180 }
    };

    function spawnNewPlane() {
        let totalActivePlanes = planes.filter(p => p.state !== "LANDED").length;
        if (totalActivePlanes >= 24) return;

        let totalInHolding = planes.filter(p => p.state === "HOLDING" || p.state === "FLYING_TO_HOLD").length;
        if (totalInHolding >= 12) return;

        let availableRoutes = routeTemplates.filter(t => {
            let planesInThisHolding = planes.filter(p => 
                p.holdingCenterX === t.holdingCenterX && 
                p.holdingCenterY === t.holdingCenterY && 
                (p.state === "HOLDING" || p.state === "FLYING_TO_HOLD")
            );
            return planesInThisHolding.length < 12;
        });

        if (availableRoutes.length === 0) return; 

        let t = availableRoutes[Math.floor(Math.random() * availableRoutes.length)];
        let code = getPlaneCode(nextPlaneIndex);
        nextPlaneIndex++;

        let typeKeys = Object.keys(AIRCRAFT_TYPES);
        let pTypeName = typeKeys[Math.floor(Math.random() * typeKeys.length)];
        let pTypeData = AIRCRAFT_TYPES[pTypeName];

        let possibleAltitudes = [7.0, 8.0, 9.0];
        let planesInThisHolding = planes.filter(p => 
            p.holdingCenterX === t.holdingCenterX && 
            p.holdingCenterY === t.holdingCenterY &&
            (p.state === "HOLDING" || p.state === "FLYING_TO_HOLD")
        );

        let takenAltitudes = planesInThisHolding.map(p => p.altitude);
        let freeAltitudes = possibleAltitudes.filter(alt => !takenAltitudes.includes(alt));

        let assignedAltitude;
        if (freeAltitudes.length > 0) {
            assignedAltitude = freeAltitudes[Math.floor(Math.random() * freeAltitudes.length)];
        } else {
            assignedAltitude = possibleAltitudes[Math.floor(Math.random() * possibleAltitudes.length)];
        }

        let planeImg = document.createElement('img');
        planeImg.src = pTypeData.img;
        planeImg.className = 'dynamic-plane';
        
        let labelDiv = document.createElement('div');
        labelDiv.className = 'dynamic-label';
        labelDiv.innerText = `${code}-${assignedAltitude.toFixed(1)}`;

        document.getElementById('planes-layer').appendChild(planeImg);
        document.getElementById('planes-layer').appendChild(labelDiv);

        let initialKnots = pTypeData.cruiseKnots;

        let newPlane = {
            code: code,
            type: pTypeName,
            minSpeed: pTypeData.minSpeed,
            maxSpeed: pTypeData.maxSpeed,
            altitude: assignedAltitude,            
            targetAltitude: assignedAltitude * 1000, 
            currentSpeed: initialKnots,                     
            targetSpeed: initialKnots,                      
            x: t.startX,
            y: t.startY,
            heading: t.heading,
            targetHeading: t.heading,
            turnDirection: null,                   
            isEstablished: false,
            inFinalApproach: false,
            state: "FLYING_TO_HOLD",
            
            holdingCenterX: t.holdingCenterX,
            holdingCenterY: t.holdingCenterY,
            holdingRadius: t.holdingRadius,
            holdingAngle: 0,

            targetX: t.targetX,
            targetY: t.targetY,
            triggerType: t.triggerType,
            triggerVal: t.triggerVal,

            trailPoints: [],
            element: planeImg,
            labelElement: labelDiv
        };

        labelDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            selectPlane(newPlane);
        });

        planes.push(newPlane);
        document.getElementById('comm-alerts').innerText = `Vlucht ${code} (${pTypeName}) binnengekomen.`;
        updateFlightProgressStrips();
    }

    function selectPlane(plane) {
        selectedPlane = plane;
        currentCommandType = null;
        commandDetails = "";

        planes.forEach(p => {
            if (p === plane) {
                p.labelElement.style.backgroundColor = '#00c000'; 
                p.element.style.zIndex = '50';  
                p.labelElement.style.zIndex = '105';
            } else {
                p.labelElement.style.backgroundColor = '#ffffff'; 
                p.element.style.zIndex = '10';
                p.labelElement.style.zIndex = '100';
            }
        });

        updateDisplayLines();
        updateCoordsDisplay();
        updateFlightProgressStrips();
    }

    function updateDisplayLines() {
        if (!selectedPlane) {
            document.getElementById('comm-atc-plane').innerText = "";
            return;
        }
        document.getElementById('comm-atc-plane').innerText = `Plane-${selectedPlane.code}: ${commandDetails}`;
    }

    function updateCoordsDisplay() {
        if (!selectedPlane) {
            document.getElementById('plane-coords-display').innerText = "Plane ID: - x = -, y = -";
            return;
        }
        document.getElementById('plane-coords-display').innerText = `Plane ID: ${selectedPlane.code}  x = ${Math.round(selectedPlane.x)}, y = ${Math.round(selectedPlane.y)}`;
    }

    document.getElementById('btn-heading').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = 'HEADING';
        commandDetails = "Say Heading!";
        updateDisplayLines();
    });

    document.getElementById('btn-altitude').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = 'ALTITUDE';
        commandDetails = "Say Altitude!";
        updateDisplayLines();
    });

    document.getElementById('btn-speed').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = 'SPEED';
        commandDetails = "Say Speed!";
        updateDisplayLines();
    });

    document.getElementById('btn-left').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = 'TURN';
        commandDetails = "Change Heading to: Left ";
        updateDisplayLines();
    });

    document.getElementById('btn-right').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = 'TURN';
        commandDetails = "Change Heading to: Right ";
        updateDisplayLines();
    });

    const appendDigit = (digit) => {
        if (!selectedPlane || currentCommandType !== 'TURN') return;
        let parts = commandDetails.split(": ");
        if (parts.length < 2) return;
        let currentVal = parts[1];
        if (currentVal.replace(/[^0-9]/g, "").length < 3) {
            commandDetails += digit;
            updateDisplayLines();
        }
    };

    document.getElementById('btn-null').addEventListener('click', () => appendDigit('0'));
    document.getElementById('btn-one').addEventListener('click', () => appendDigit('1'));
    document.getElementById('btn-two').addEventListener('click', () => appendDigit('2'));
    document.getElementById('btn-three').addEventListener('click', () => appendDigit('3'));
    document.getElementById('btn-four').addEventListener('click', () => appendDigit('4'));
    document.getElementById('btn-five').addEventListener('click', () => appendDigit('5'));
    document.getElementById('btn-six').addEventListener('click', () => appendDigit('6'));
    document.getElementById('btn-seven').addEventListener('click', () => appendDigit('7'));
    document.getElementById('btn-eight').addEventListener('click', () => appendDigit('8'));
    document.getElementById('btn-nine').addEventListener('click', () => appendDigit('9'));

    document.getElementById('btn-est').addEventListener('click', () => {
        if (!selectedPlane) return;
        if (currentCommandType === 'TURN' && commandDetails.replace(/[^0-9]/g, "").length > 0) {
            if (!commandDetails.includes("-Establish")) {
                commandDetails += "-Establish";
                updateDisplayLines();
            }
        }
    });

    document.getElementById('btn-altitude_up').addEventListener('click', () => {
        if (!selectedPlane) return;
        if (currentCommandType !== 'ALT_CHANGE') {
            currentCommandType = 'ALT_CHANGE';
            bufferTargetAltitude = selectedPlane.targetAltitude;
        }
        bufferTargetAltitude = Math.min(9000, bufferTargetAltitude + 1000);
        commandDetails = `Change Altitude to: ${bufferTargetAltitude} feet`;
        updateDisplayLines();
    });

    document.getElementById('btn-altitude_down').addEventListener('click', () => {
        if (!selectedPlane) return;
        if (currentCommandType !== 'ALT_CHANGE') {
            currentCommandType = 'ALT_CHANGE';
            bufferTargetAltitude = selectedPlane.targetAltitude;
        }
        bufferTargetAltitude = Math.max(0, bufferTargetAltitude - 1000);
        commandDetails = `Change Altitude to: ${bufferTargetAltitude} feet`;
        updateDisplayLines();
    });

    document.getElementById('btn-speed_up').addEventListener('click', () => {
        if (!selectedPlane) return;
        if (currentCommandType !== 'SPD_CHANGE') {
            currentCommandType = 'SPD_CHANGE';
            bufferTargetSpeed = selectedPlane.targetSpeed;
        }
        bufferTargetSpeed = Math.min(selectedPlane.maxSpeed, bufferTargetSpeed + 10);
        commandDetails = `Change Speed to: ${bufferTargetSpeed} knots`;
        updateDisplayLines();
    });

    document.getElementById('btn-speed_down').addEventListener('click', () => {
        if (!selectedPlane) return;
        if (currentCommandType !== 'SPD_CHANGE') {
            currentCommandType = 'SPD_CHANGE';
            bufferTargetSpeed = selectedPlane.targetSpeed;
        }
        bufferTargetSpeed = Math.max(0, bufferTargetSpeed - 10);
        commandDetails = `Change Speed to: ${bufferTargetSpeed} knots`;
        updateDisplayLines();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
        if (!selectedPlane) return;
        currentCommandType = null;
        commandDetails = "";
        updateDisplayLines();
        document.getElementById('comm-plane-atc').innerText = "";
    });

    document.getElementById('btn-send').addEventListener('click', () => {
        if (!selectedPlane) return;

        if (selectedPlane.inFinalApproach) {
            document.getElementById('comm-plane-atc').innerText = `Plane-${selectedPlane.code}: Negatief, final approach!`;
            commandDetails = "";
            currentCommandType = null;
            updateDisplayLines();
            return;
        }

        let pCode = selectedPlane.code;
        let sentText = commandDetails;
        let replyText = "";

        if (sentText === "Say Heading!") {
            replyText = `Plane-${pCode}: Heading is ${Math.round(selectedPlane.heading)}`;
        } else if (sentText === "Say Altitude!") {
            replyText = `Plane-${pCode}: Altitude is ${selectedPlane.targetAltitude} feet`;
        } else if (sentText === "Say Speed!") {
            replyText = `Plane-${pCode}: Speed is ${Math.round(selectedPlane.currentSpeed)} knots.`;
        } else if (currentCommandType === 'TURN') {
            let isLeft = sentText.includes("Left");
            let numMatch = sentText.match(/\d+/);
            if (numMatch) {
                selectedPlane.targetHeading = parseInt(numMatch[0], 10);
                selectedPlane.turnDirection = isLeft ? 'L' : 'R';
                selectedPlane.isEstablished = sentText.includes("-Establish");
                selectedPlane.state = "TURNING"; 
            }
            replyText = `Plane-${pCode}: ${sentText}. ROGER!`;
        } else if (currentCommandType === 'ALT_CHANGE') {
            // Controleer wettelijke hoogtelimieten (2000 tot 9000 ft, behalve tijdens landing naar 0)
            if (bufferTargetAltitude > 0 && (bufferTargetAltitude < 2000 || bufferTargetAltitude > 9000)) {
                replyText = `Plane-${pCode}: wrong lev`;
            } else {
                selectedPlane.targetAltitude = bufferTargetAltitude;
                replyText = `Plane-${pCode}: ${sentText}. ROGER!`;
            }
        } else if (currentCommandType === 'SPD_CHANGE') {
            // Controleer snelheidslimieten per vliegtuigtype (behalve bij remmen naar 0 op baan)
            if (bufferTargetSpeed > 0 && (bufferTargetSpeed < selectedPlane.minSpeed || bufferTargetSpeed > selectedPlane.maxSpeed)) {
                replyText = `Plane-${pCode}: wrong spd`;
            } else {
                selectedPlane.targetSpeed = bufferTargetSpeed;
                replyText = `Plane-${pCode}: ${sentText}. ROGER!`;
            }
        }

        document.getElementById('comm-plane-atc').innerText = replyText;
        commandDetails = "";
        currentCommandType = null;
        updateDisplayLines();
        updateFlightProgressStrips();
    });

    let lastTime = 0;
    let seconds = 0;
    let counterContainer = document.getElementById('radar-counter');

    function updateCounter() {
        if (!counterContainer) return;
        counterContainer.innerHTML = 
            '<div style="display: flex; justify-content: center; align-items: center;">' +
                '<div style="text-align: center;">' +
                    '<div style="font-size: 36px; color: #000; font-weight: bold;">' + seconds.toLocaleString() + '</div>' +
                    '<div style="font-size: 10px; color: #555; margin-top: 2px;">SECONDS</div>' +
                '</div>' +
            '</div>';
        seconds += SIMULATION.gameSpeed;
    }

    const setupButton = (id, upImg, doImg) => {

        if(!btn) return;
        btn.addEventListener('mousedown', () => btn.src = `graphics/${doImg}`);
        btn.addEventListener('mouseup', () => btn.src = `graphics/${upImg}`);
        btn.addEventListener('mouseleave', () => btn.src = `graphics/${upImg}`);
    };

    setupButton('btn-heading', 'But_Heading_Up.png', 'But_Heading_Do.png');
    setupButton('btn-left', 'But_L_Up.png', 'But_L_Do.png');
    setupButton('btn-est', 'But_Est_Up.png', 'But_Est_Do.png');
    setupButton('btn-right', 'But_R_Up.png', 'But_R_Do.png');
    setupButton('btn-null', 'But_0_Up.png', 'But_0_Do.png');

	setupButton('btn-send', 'But_Send_Up.png', 'But_Send_Do.png');
	setupButton('btn-clear', 'But_Clear_Up.png', 'But_Clear_Do.png');

    function updateFlightProgressStrips() {
        const sectors = [
            { id: 'strips-sea', center: { x: 415, y: 290 } },
            { id: 'strips-lake', center: { x: 945, y: 322 } },
            { id: 'strips-river', center: { x: 403, y: 778 } }
        ];

        sectors.forEach(sector => {
            const container = document.getElementById(sector.id);
            if (!container) return;
            container.innerHTML = '';

            let activePlanes = planes.filter(p => 
                Math.abs(p.holdingCenterX - sector.center.x) < 5 && 
                Math.abs(p.holdingCenterY - sector.center.y) < 5 &&
                p.state !== "LANDED"
            );

            activePlanes.forEach((p, index) => {
                let strip = document.createElement('div');
                strip.className = `fps-strip ${index >= 6 ? 'stacked' : ''}`;
                
                if (selectedPlane === p) {
                    strip.style.backgroundColor = '#00c000';
                    strip.style.color = '#ffffff';
                }

                // Realtime RMA check op basis van de echte x/y coördinaten
                let isRmaGreen = (p.x >= 536 && p.x <= 787 && p.y >= 539 && p.y <= 788); 
                let lampClass = isRmaGreen ? 'lamp-green' : 'lamp-red';

                let hdText = "H";
                if (p.state === "TURNING" || p.state === "FLYING_HEADING") {
                    hdText = Math.round(p.heading);
                    if (p.isEstablished) hdText += "e";
                } else if (p.state === "ILS_LOCKED") {
                    hdText = "loc/EST";
                } else if (p.state === "LANDING") {
                    hdText = "LAND";
                }

                strip.innerHTML = `
                    <div class="strip-col-aca">${p.code}-${p.type[0].toLowerCase()}-${p.altitude.toFixed(0)}</div>
                    <div class="strip-col-hd">${hdText}</div>
                    <div class="strip-col-sp">${Math.round(p.currentSpeed)}</div>
                    <div class="strip-col-rma"><div class="rma-lamp ${lampClass}"></div></div>
                `;

                strip.addEventListener('click', () => {
                    selectPlane(p);
                });

                container.appendChild(strip);
            });
        });
    }

    function updateGame(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let realDeltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        let deltaTime = realDeltaTime * SIMULATION.gameSpeed;

        timeSinceLastSpawn += deltaTime;
        if (timeSinceLastSpawn >= nextSpawnInterval) {
            timeSinceLastSpawn = 0;
            nextSpawnInterval = getRandomSpawnInterval();
            spawnNewPlane();
        }

        planes.forEach(p => {
            if (p.state === "LANDED") return;

            let distPx = p.y - RUNWAY.y;
            let distNM = Math.max(0, distPx / PIXELS_PER_NM);
            let glideSlopeAlt = distNM * 300; 

            // --- 1. ILS INTERCEPTIE CHECK (Geleidelijk indraaien naar koers 000) ---
            if (p.isEstablished && p.state !== "ILS_LOCKED" && p.state !== "LANDING" && p.state !== "OVERSHOOT") {
                let nearCenterline = Math.abs(p.x - RUNWAY.x) < 6; 
                if (nearCenterline) {
                    let validAngle = (p.heading >= 0 && p.heading <= 30) || (p.heading >= 330 && p.heading <= 360);
                    let validAlt = (p.altitude * 1000) <= (glideSlopeAlt + 200);

                    if (validAngle && validAlt) {
                        p.state = "ILS_LOCKED";
                        p.targetHeading = 0; // Zet koers op 0, draait er nu geleidelijk naartoe!
                        document.getElementById('comm-alerts').innerText = `Vlucht ${p.code} locked op ILS, indraaien naar 000.`;
                    } else {
                        p.isEstablished = false; 
                        let reason = !validAngle ? "verkeerde hoek" : "te hoog voor glijpad";
                        document.getElementById('comm-alerts').innerText = `Vlucht ${p.code} mist ILS koppeling: ${reason}.`;
                    }
                }
            }

            // --- 2. AUTONOME ILS GELEIDING & OVERSHOOT CHECKS ---
            if (p.state === "ILS_LOCKED") {
                p.targetAltitude = glideSlopeAlt / 1000;
                p.targetSpeed = 140;

                if (distNM <= 10) {
                    p.inFinalApproach = true;
                    let isTooHigh = (p.altitude * 1000) > (glideSlopeAlt + 400);
                    let isTooFast = p.currentSpeed > 180;

                    if (isTooHigh || isTooFast) {
                        p.state = "OVERSHOOT";
                        p.isEstablished = false;
                        p.targetAltitude = 3.0;
                        p.targetHeading = 80;
                        
                        let reasonText = isTooHigh && isTooFast ? "too high and too fast" : (isTooHigh ? "too high" : "too fast");
                        document.getElementById('comm-alerts').innerText = `Vlucht ${p.code} OVERSHOOT (${reasonText})!`;
                    }
                }

                if (distPx <= 0) {
                    p.state = "LANDING";
                    p.targetSpeed = 0;
                    p.targetAltitude = 0;
                }
            }

            let onRunway = (p.x >= 714 && p.x <= 730 && p.y >= 499 && p.y <= 535);
            if (onRunway && p.state !== "LANDING" && p.state !== "ILS_LOCKED") {
                p.state = "LANDING";
                p.targetSpeed = 0;
                p.targetAltitude = 0;
            }

            if (p.state === "LANDING") {
                p.currentSpeed = Math.max(0, p.currentSpeed - 30 * deltaTime);
                p.altitude = Math.max(0, p.altitude - 1.0 * deltaTime);

                if (p.currentSpeed === 0 && p.altitude === 0) {
                    p.state = "LANDED";
                    if (p.element) p.element.remove();
                    if (p.labelElement) p.labelElement.remove();
                    updateFlightProgressStrips();
                    return;
                }
            } else if (p.state !== "ILS_LOCKED") {
                if (p.currentSpeed < p.targetSpeed) {
                    p.currentSpeed = Math.min(p.targetSpeed, p.currentSpeed + 15 * deltaTime);
                } else if (p.currentSpeed > p.targetSpeed) {
                    p.currentSpeed = Math.max(p.targetSpeed, p.currentSpeed - 5 * deltaTime);
                }

                let currentAltFt = p.altitude * 1000;
                if (currentAltFt < p.targetAltitude) {
                    p.altitude = Math.min(p.targetAltitude / 1000, p.altitude + 0.2 * deltaTime);
                } else if (currentAltFt > p.targetAltitude) {
                    p.altitude = Math.max(p.targetAltitude / 1000, p.altitude - 0.2 * deltaTime);
                }
            }

            p.labelElement.innerText = `${p.code}-${p.altitude.toFixed(1)}`;

            let speedPxPerSec = knotsToPixelsPerSecond(p.currentSpeed);

            if (p.state === "FLYING_TO_HOLD") {
                let rad = (p.heading - 90) * (Math.PI / 180);
                p.x += Math.cos(rad) * speedPxPerSec * deltaTime;
                p.y += Math.sin(rad) * speedPxPerSec * deltaTime;

                let triggerReached = false;
                if (p.triggerType === "Y" && p.y <= p.triggerVal) triggerReached = true;
                if (p.triggerType === "X" && p.x <= p.triggerVal) triggerReached = true;

                if (triggerReached) {
                    p.state = "HOLDING";
                    p.holdingAngle = Math.atan2(p.y - p.holdingCenterY, p.x - p.holdingCenterX);
                }
            } 
            else if (p.state === "HOLDING") {
                let angularSpeed = speedPxPerSec / p.holdingRadius; 
                p.holdingAngle += angularSpeed * deltaTime;

                p.x = p.holdingCenterX + p.holdingRadius * Math.cos(p.holdingAngle);
                p.y = p.holdingCenterY + p.holdingRadius * Math.sin(p.holdingAngle);

                p.heading = (p.holdingAngle * 180 / Math.PI) + 180;
            }
            else if (p.state === "TURNING" || p.state === "FLYING_HEADING" || p.state === "ILS_LOCKED" || p.state === "OVERSHOOT") {
                let diff = (p.targetHeading - p.heading + 540) % 360 - 180;
                
                if (Math.abs(diff) > 0.5 && p.state !== "LANDING") {
                    let baseTurnRate = 5;
                    if (p.type === "HEAVY") baseTurnRate = 2.5;
                    else if (p.type === "MEDIUM") baseTurnRate = 3.5;
                    else if (p.type === "LIGHT") baseTurnRate = 4.5;

                    let turnRate = baseTurnRate * deltaTime; 
                    
                    if (Math.abs(diff) <= turnRate) {
                        p.heading = p.targetHeading;
                        if (p.state === "TURNING") p.state = "FLYING_HEADING";
                    } else {
                        if (p.turnDirection === 'L') {
                            p.heading -= turnRate; 
                        } else if (p.heading === undefined) {
                            p.heading += 0;
                        } else {
                            if (diff > 0) p.heading += turnRate;
                            else p.heading -= turnRate;
                        }
                    }
                    
                    p.heading = (p.heading + 360) % 360;
                } else if (p.state !== "LANDING" && p.state !== "ILS_LOCKED") {
                    p.heading = p.targetHeading;
                    if (p.state === "TURNING") p.state = "FLYING_HEADING";
                }

                let rad = (p.heading - 90) * (Math.PI / 180);
                p.x += Math.cos(rad) * speedPxPerSec * deltaTime;
                p.y += Math.sin(rad) * speedPxPerSec * deltaTime;
            }

            p.element.style.left = p.x + 'px';
            p.element.style.top = p.y + 'px';
            p.element.style.transform = `translate(-50%, -50%) rotate(${p.heading}deg)`;

            p.labelElement.style.left = p.x + 'px';
            p.labelElement.style.top = p.y + 'px';

            let trailSpacing = 1; 
            let lastPoint = p.trailPoints[p.trailPoints.length - 1];
            let distanceSinceLast = lastPoint ? Math.hypot(p.x - lastPoint.x, p.y - lastPoint.y) : trailSpacing + 1;

            if (distanceSinceLast >= trailSpacing && p.state !== "LANDING") {
                p.trailPoints.push({ x: p.x, y: p.y });
                if (p.trailPoints.length > 70) {
                    p.trailPoints.shift(); 
                }
            }
        });

        if (selectedPlane) {
            updateCoordsDisplay();
        }

        // Update realtime de RMA lampjes op de strips tijdens het vliegen
        updateFlightProgressStrips();

        renderAllTrails();
        requestAnimationFrame(updateGame);
    }

    let trailContainer = document.getElementById('trail-container');
    function renderAllTrails() {
        trailContainer.innerHTML = '';
        planes.forEach(p => {
            if (p.state === "LANDED") return;
            p.trailPoints.forEach((pt, index) => {
                let dot = document.createElement('div');
                dot.className = 'trail-dot';
                dot.style.left = pt.x + 'px';
                dot.style.top = pt.y + 'px';
                let opacity = (index + 1) / p.trailPoints.length;
                dot.style.opacity = opacity * 0.7;
                trailContainer.appendChild(dot);
            });
        });
    }

    window.onload = function() {
        updateCounter();
        setInterval(updateCounter, 1000);
        spawnNewPlane(); 
        requestAnimationFrame(updateGame);
    };
</script>
