<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ATC Radar Simulator - Layout Test</title>
    <style>
        /* Reset html en body volledig om elke automatische marge te blokkeren */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Zet de afbeelding strak linksboven zonder marges */
        .layout-image {
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }
    </style>
</head>
<body>

    <img src="Container Verdeling_1.png" alt="Container Verdeling_1" class="layout-image">

</body>
</html>
