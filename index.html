<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ATC Radar Simulator - Scaled Container</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* De virtuele schaalbare container van 1440x900 */
        #game-container {
            position: relative;
            width: 1440px;
            height: 900px;
            background-color: #1a1a1a;
            transform-origin: center center;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* LAAG 1: De radar / kaart (Onderop) */
        #radar-map-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 1;
        }

        /* LAAG 2: De vliegtuigen en sporen (In het midden, achter het frame) */
        #planes-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 5;
            pointer-events: none;
        }

        /* LAAG 3: Het dashboard frame met transparant gat (Bovenop) */
        #dashboard-frame {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 10;
            pointer-events: none;
        }

        /* LAAG 4: Alle knoppen en interactieve elementen (Meest bovenop) */
        #buttons-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            z-index: 15;
        }

        /* Stijlen voor dynamische elementen binnen de game */
        .dynamic-plane {
            position: absolute;
            width: 32px;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .dynamic-label {
            position: absolute;
            background-color: #ffffff;         
            border: 1px solid #000000;         
            padding: 1px 4px;                  
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #000000;
            cursor: pointer; 
            white-space: nowrap;
            transform: translate(18px, -18px); 
            z-index: 105;
        }

        .trail-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: blue;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">

        <!-- LAAG 1: Radar achtergrond -->
        <div id="radar-map-layer">
            <img src="Radar.png" alt="Radar Kaart" style="width: 100%; height: 100%; display: block;">
        </div>

        <!-- LAAG 2: Vliegtuigen en sporen -->
        <div id="planes-layer">
            <div id="trail-container"></div>
            <!-- Vliegtuigen komen hier dynamisch bij via Javascript -->
        </div>

        <!-- LAAG 3: Het Front Frame met het transparante gat -->
        <img src="Front_Frame.png" id="dashboard-frame" alt="Dashboard Frame">

        <!-- LAAG 4: Alle knoppen, tekstvlakken en tellers -->
        <div id="buttons-layer">
            <!-- Plaats hier al je knoppen zoals heading-control-group, comm-control-group, tellers, etc. -->
        </div>

    </div>

<script>
    // Automatisch schalen van de game-container naar het venster zonder scrollbalken
    function resizeGame() {
        const container = document.getElementById('game-container');
        const targetWidth = 1440;
        const targetHeight = 900;
        
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        const scaleX = windowWidth / targetWidth;
        const scaleY = windowHeight / targetHeight;
        
        const scale = Math.min(scaleX, scaleY);
        container.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);
</script>

</body>
</html>
